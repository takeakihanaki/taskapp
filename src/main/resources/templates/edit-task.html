<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク編集</title>

    <!-- ===== Bootstrap（見た目整える用） ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* フォームを中央に寄せる */
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
        }

        button {
            width: 100%;
        }

        .back-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div class="form-container">

        <!-- ===== カレンダーに戻るボタン ===== -->
        <a href="/" class="btn btn-secondary back-btn">カレンダーに戻る</a>

        <h2 class="text-center mb-4">タスク編集画面</h2>

        <!-- ===== 編集フォーム ===== -->
        <form th:action="@{/tasks/update}" th:object="${task}" method="post">

            <!-- IDは非表示で送信 -->
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label">タイトル</label>
                <input type="text" class="form-control" th:field="*{content}" />
            </div>

            <div class="mb-3">
                <label class="form-label">日付</label>
                <input type="date" class="form-control" th:field="*{taskDate}" />
            </div>

            <div class="mb-3">
                <label class="form-label">時間</label>
                <input type="time" class="form-control" th:field="*{taskTime}" />
            </div>

            <button type="submit" class="btn btn-primary">更新</button>
        </form>
    </div>
</div>

</body>
</html>
