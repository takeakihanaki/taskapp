<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Task Calendar</title>

    <!-- ===== Bootstrap（簡単に見た目整える用） ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ===== FullCalendar CSS & JS ===== -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- ===== 日本語化 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/ja.global.min.js"></script>

    <style>
        /* カレンダーの余白を調整 */
        #calendar {
            max-width: 900px;
            margin: 40px auto;
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <h1 class="text-center my-4">タスクカレンダー</h1>

    <!-- ===== ここにカレンダーを表示 ===== -->
    <div id="calendar"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    // カレンダーを設置するHTML要素
    var calendarEl = document.getElementById('calendar');

    // FullCalendarインスタンス生成
    var calendar = new FullCalendar.Calendar(calendarEl, {

        // 初期表示は月表示
        initialView: 'dayGridMonth',

        // 日本語表示
        locale: 'ja',

        // 上部のツールバー設定
        headerToolbar: {
            left: 'prev,next today',          // 左に「前・次・今日」ボタン
            center: 'title',                  // 真ん中に月/週/日タイトル
            right: 'dayGridMonth,timeGridWeek,timeGridDay' // 右に切替ボタン
        },

        // REST APIからタスクイベントを読み込む
        events: '/api/calendar',

        // イベントクリック時の挙動（必要に応じて編集画面へ）
        eventClick: function(info) {
			// タスクIDを確認するポップアップ
			alert("タスクID: " + info.event.id);
			// タスクIDをURLに付与して編集画面へ遷移
			window.location.href = '/tasks/edit/' + info.event.id;
        }
    });

    // カレンダー描画
    calendar.render();
});
</script>

</body>
</html>
